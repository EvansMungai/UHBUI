<header>
    <nav class="w-full border-b border-gray-100 dark:border-gray-700 bg-primary shadow-sm dark:bg-primary-alt">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <!-- Main navbar row -->
            <div class="flex h-16 items-center justify-between">
                <a routerLink="/" class="shrink-0" (click)="closeMobileMenu()">
                    <span class="text-2xl dark:text-white font-bold tracking-tight text-gray-900">
                        UHB
                    </span>
                </a>
                <div class="flex items-center">
                    <!-- Desktop navigation -->
                    <button type="button" class="mr-2 inline-flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 text-gray-600 transition-colors bg-secondary hover:ring-2 hover:ring-base hover:text-gray-900 dark:bg-secondary dark:border-gray-700 dark:text-gray-200 dark:hover:text-white"
                        [attr.aria-label]="darkMode() ? 'Light mode' : 'Dark mode'"
                        [attr.title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
                        (click)="toggleTheme()">

                        @if (!darkMode()) {
                        <!-- Moon -->
                        <svg class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                        </svg>
                        } @else {
                        <!-- Sun -->
                        <svg class="h-4 w-4 text-yellow-500 dark:text-yellow-400" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 3v1 m0 16v1 m9-9h-1 M4 12H3 m15.364-6.364l-.707.707 M6.343 17.657l-.707.707 M17.657 17.657l-.707-.707 M6.343 6.343l-.707-.707 M12 8a4 4 0 100 8 4 4 0 000-8z" />
                        </svg>
                        }
                    </button>

                    <div class="hidden items-center gap-1 lg:flex">
                        <a routerLink="/login"
                            class="font-semibold py-2 px-[1.1rem]! rounded-md bg-base text-center text-sm font-semibold text-white hover:accent focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-1 transition-all duration-200 ease-in">
                            Login
                        </a>
                        <a routerLink="/login"
                            class="ml-2 font-semibold py-2 px-[1.1rem]! rounded-md bg-base text-center text-sm font-semibold text-white hover:accent focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-1 transition-all duration-200 ease-in">
                            Sign up
                        </a>

                    </div>

                    <!-- Mobile hamburger -->
                    <button type="button"
                        class="inline-flex items-center justify-center rounded-md p-2 text-gray-600 transition hover:ring-2 hover:ring-base hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-base dark:focus:ring-none lg:hidden"
                        [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-menu"
                        (click)="toggleMobileMenu()">

                        <span class="sr-only">
                            {{ mobileMenuOpen() ? 'Close main menu' : 'Open main menu' }}
                        </span>

                        @if (!mobileMenuOpen()) {
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        } @else {
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        }

                    </button>
                </div>
            </div>

            <!-- Mobile menu -->
            @if (mobileMenuOpen()) {
            <div id="mobile-menu" class="py-3 lg:hidden">
                <div class="flex flex-col gap-1">
                    <!-- Mobile Get Started -->
                    <a routerLink="/login"
                        class="mt-2 block rounded-md bg-base px-5 py-2.5 text-center text-sm font-semibold text-white transition hover:accent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                        (click)="closeMobileMenu()">
                        Login
                    </a>
                    <a routerLink="/signup"
                        class="mt-2 block rounded-md bg-base px-5 py-2.5 text-center text-sm font-semibold text-white transition hover:accent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                        (click)="closeMobileMenu()">
                        Sign Up
                    </a>

                </div>
            </div>
            }

        </div>
    </nav>
</header>
