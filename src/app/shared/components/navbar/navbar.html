<header>
    <nav class="border-b border-gray-200 bg-white px-4 py-3">
        <div class="mx-auto max-w-screen-xl">
            <!-- Main navbar row -->
            <div class="flex items-center justify-between">
                <a routerLink="/" class="flex shrink-0 items-center" (click)="closeMobileMenu()">
                    <span class="text-xl font-semibold whitespace-nowrap">
                        Application Title
                    </span>
                </a>
                <div class="flex items-center">
                    <!-- Desktop actions -->
                    <div class="hidden items-center gap-6 lg:flex">
                        <a routerLink="/login" routerLinkActive="text-primary-700"
                            [routerLinkActiveOptions]="{ exact: true }" class="text-sm font-medium text-gray-700
                                   transition hover:text-primary-700">
                            Login
                        </a>

                        <a routerLink="/signup" routerLinkActive="text-primary-700"
                            [routerLinkActiveOptions]="{ exact: true }" class="text-sm font-medium text-gray-700
                                   transition hover:text-primary-700">
                            Sign Up
                        </a>
                    </div>

                    <!-- Mobile hamburger -->
                    <button type="button" class="inline-flex items-center rounded-lg p-2
                               text-gray-500
                               hover:bg-gray-100
                               focus:outline-none
                               focus:ring-2
                               focus:ring-gray-200
                               lg:hidden" [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-menu"
                        (click)="toggleMobileMenu()">
                        <span class="sr-only">
                            {{ mobileMenuOpen()
                            ? 'Close main menu'
                            : 'Open main menu' }}
                        </span>

                        @if (!mobileMenuOpen()) {
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        } @else {
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        }
                    </button>
                </div>
            </div>

            <!-- Mobile menu -->
            @if (mobileMenuOpen()) {
            <div id="mobile-menu" class="border-t border-gray-100 pt-3 lg:hidden">
                <div class="flex flex-col">
                    <a routerLink="/login" routerLinkActive="bg-gray-100 text-gray-900"
                        [routerLinkActiveOptions]="{ exact: true }" class="rounded-lg px-3 py-2.5 text-sm
                                   font-medium text-gray-700
                                   transition hover:bg-gray-100
                                   hover:text-gray-900" (click)="closeMobileMenu()">
                        Login
                    </a>
                    <a routerLink="/signup" routerLinkActive="bg-gray-100 text-gray-900"
                        [routerLinkActiveOptions]="{ exact: true }" class="rounded-lg px-3 py-2.5 text-sm
                                   font-medium text-gray-700
                                   transition hover:bg-gray-100
                                   hover:text-gray-900" (click)="closeMobileMenu()">
                        Sign Up
                    </a>
                </div>
            </div>
            }
        </div>
    </nav>
</header>
