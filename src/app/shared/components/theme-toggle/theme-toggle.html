<button type="button"
    class="mr-2 inline-flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 text-gray-600 transition-colors bg-secondary hover:ring-2 hover:ring-base hover:text-gray-900 dark:bg-secondary dark:border-gray-700 dark:text-gray-200 dark:hover:text-white"
    /* [attr.aria-label]="darkMode() ? 'Light mode' : 'Dark mode'" */ /*
    [attr.title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'" */ (click)="themeService.toggle()">

    @if (!themeService.darkMode()) {
    <!-- Moon -->
    <svg class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
    </svg>
    } @else {
    <!-- Sun -->
    <svg class="h-4 w-4 text-yellow-500 dark:text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1 m0 16v1 m9-9h-1 M4 12H3 m15.364-6.364l-.707.707 M6.343 17.657l-.707.707 M17.657 17.657l-.707-.707 M6.343 6.343l-.707-.707 M12 8a4 4 0 100 8 4 4 0 000-8z" />
    </svg>
    }
</button>
