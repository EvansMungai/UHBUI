<div id="toast" [class]="styles">
    @if(headerTemplate()){
    <div>
        <ng-container *ngTemplateOutlet="headerTemplate()"></ng-container>
    </div>
    }
    <div id="content">
        <h2 class="text=base font-semibold text-heading">{{summary()}}</h2>
        @if (detail()) {
        <p>{{detail()}}</p>
        }
        <ng-content></ng-content>
    </div>
</div>
