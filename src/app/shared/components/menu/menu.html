<nav>
    @for (section of sections(); track section.title) {
    <section class="mb-6 last:mb-0">
        <h2 class="mb-2 text-xs uppercase text-gray-400">
            {{ section.title }}
        </h2>
        <div class="space-y-0.5">
            @for (item of section.items; track item.link) {
            <a [routerLink]="item.link" routerLinkActive="bg-gray-100 font-medium text-gray-900"
                [routerLinkActiveOptions]="{ exact: true }"
                class="block rounded-lg px-3 py-2 text-sm text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
                (click)="onNavigate()">
                {{ item.label }}
            </a>
            }
        </div>
    </section>
    }
</nav>
