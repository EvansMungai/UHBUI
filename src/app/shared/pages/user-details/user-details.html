<div class="flex flex-col dark:text-white px-4">
    <h1 class="text-2xl md:text-[35px] font-bold text-center">USER PROFILE INFORMATION</h1>
    <div>
        <p class="my-3 md:my-5 text-sm">Below are the details of your profile. If you would like to changes to
            your password, simply
            click the 'Change Password' button to update it with ease.</p>

        <app-card [cardStyles]="'bg-primary dark:bg-primary-alt shadow-xl rounded-lg p-6 w-full'">
            <div class="overflow-hidden">
                <div class="px-5 py-4 md:px-6 md:py-5">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full bg-accent dark:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>

                        <div>
                            <h2 class="text-lg md:text-xl font-bold dark:text-white">
                                Profile Information
                            </h2>
                            <p class="text-sm text-accent">
                                Your account details
                            </p>
                        </div>
                    </div>
                </div>
                <div class="divide-y divide-gray-100">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 px-5 py-4 md:px-6">
                        <div class="flex items-center gap-2 w-full sm:w-1/4 md:w-1/5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>

                            <span class="text-sm font-semibold dark:text-primary">
                                Username
                            </span>
                        </div>

                        <div class="flex-grow font-medium dark:text-primary">
                            {{username}}
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 px-5 py-4 md:px-6">
                        <div class="flex items-center gap-2 w-full sm:w-1/4 md:w-1/5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                            <span class="text-sm font-semibold dark:text-primary">
                                Role
                            </span>
                        </div>

                        <div class="flex flex-wrap gap-2">
                            @for (role of roles; track $index) {
                            <span class="inline-flex items-center px-3 py-1 rounded-full
                                 text-xs font-semibold dark:text-primary">
                                {{role}}
                            </span>
                            }
                        </div>
                    </div>

                </div>
            </div>

            <div class="mt-4">
                <!-- <button
        class="btn bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 md:py-3 md:px-6 rounded-md transition duration-300 w-full sm:w-auto"
        (click)="toggleChangePasswordForm()">
        Change Password
      </button> -->
            </div>
        </app-card>
        <!-- @if (showChangePasswordForm) {
    <div>
      <app-change-password />
    </div>
    } -->
    </div>
</div>
