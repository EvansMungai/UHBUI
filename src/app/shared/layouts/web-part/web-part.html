<div class="min-h-screen bg-white lg:grid lg:grid-cols-[14.5rem_1fr]">
    <!-- Desktop Sidebar -->
    <aside class="hidden border-r border-gray-200 bg-white lg:block">
        <div class="sticky top-0 h-screen">
            <!-- Logo -->
            <div class="flex h-15 items-center border-b border-gray-200 px-5">
                <a href="#" class="flex items-center gap-2 no-underline">
                    <img src="https://raw.githubusercontent.com/hummingbirdui/hummingbird/c2a66a70db897fd0d89ea72e7cbab1d3c06a93e2/apps/docs/src/assets/images/logos/hb-logo1.svg"
                        alt="Logo" class="h-8 w-8" />
                    <span class="font-semibold text-gray-600">
                        Application Title
                    </span>
                </a>
            </div>
            <!-- Navigation -->
            <div class="h-[calc(100vh-3.75rem)] overflow-y-auto p-5">
                <app-menu [sections]="menuSections" (navigate)="closeMobileMenu()" />
            </div>
        </div>
    </aside>

    <!-- Mobile Sidebar -->
    @if (mobileMenuOpen()) {
    <div class="fixed inset-0 z-40 bg-black/40 lg:hidden" (click)="closeMobileMenu()"></div>
    <aside class="fixed inset-y-0 left-0 z-50 w-66 bg-white shadow-xl lg:hidden">
        <!-- Sidebar Header -->
        <div class="flex h-15 items-center justify-between border-b border-gray-200 px-5">
            <a href="#" class="flex items-center gap-2 no-underline">
                <img src="https://raw.githubusercontent.com/hummingbirdui/hummingbird/c2a66a70db897fd0d89ea72e7cbab1d3c06a93e2/apps/docs/src/assets/images/logos/hb-logo1.svg"
                    alt="Logo" class="h-8 w-8" />
                <span class="font-semibold text-gray-600">
                    Application Title
                </span>
            </a>
            <!-- Close -->
            <button type="button" class="rounded-lg p-2 text-gray-500 transition hover:bg-gray-100 hover:text-gray-900"
                aria-label="Close navigation" (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="h-5 w-5">
                    <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>

        <!-- Mobile Navigation -->
        <div class="h-[calc(100vh-3.75rem)] overflow-y-auto p-5">
            <!-- Dashboards -->
            <app-menu [sections]="menuSections" (navigate)="closeMobileMenu()" />
        </div>
    </aside>
    }
    <!-- Main Content -->
    <main class="min-w-0">
        <!-- Header -->
        <header
            class="fixed top-0 z-30 flex h-15 w-full items-center border-b border-gray-200 bg-white px-6 lg:w-[calc(100%-14.5rem)]">
            <button type="button"
                class="mr-4 rounded-lg p-2 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900 lg:hidden"
                aria-label="Toggle navigation" [attr.aria-expanded]="mobileMenuOpen()" (click)="toggleMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="h-5 w-5">
                    <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <!-- Breadcrumb -->
            <app-breadcrumb page="E-commerce" />

            <!-- User Menu -->
            <details class="relative ml-auto">
                <summary
                    class="cursor-pointer list-none rounded-full focus:outline-none focus:ring-2 focus:ring-gray-300">
                    <img src="https://raw.githubusercontent.com/hummingbirdui/hummingbird/refs/heads/main/apps/docs/public/images/avatar/avatar_1.webp"
                        alt="Avatar" class="h-8 w-8 rounded-full" />
                </summary>
                <!-- Dropdown -->
                <div
                    class="absolute right-0 mt-2 w-48 overflow-hidden rounded-lg border border-gray-200 bg-white py-1 shadow-lg">
                    <app-menu [sections]="dropdownMenuSections" (navigate)="closeMobileMenu()" />
                </div>
            </details>
        </header>

        <!-- Page Content -->
        <div class="flex min-h-screen flex-col pt-15">
            <div class="flex flex-1 flex-col p-6">
                <div class="mt-4 flex-1 rounded-lg bg-gray-100 md:mt-6"></div>
            </div>
        </div>
    </main>
</div>
