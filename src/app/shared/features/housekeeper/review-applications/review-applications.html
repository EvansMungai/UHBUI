<div class="flex-1 px-4 sm:px-9">

        <app-card [cardStyles]="'bg-primary dark:bg-primary-alt shadow-xl rounded-lg p-6 block w-full'">
            <p class="dark:text-white">Total Applications</p>
        </app-card>
        <app-card [cardStyles]="'bg-primary dark:bg-primary-alt shadow-xl rounded-lg p-6 block'">
